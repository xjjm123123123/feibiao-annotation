<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>飞标 · 框选</title>
  <style>
    /* 方案 B 框选浮层：透明全屏、半暗蒙层。支持「矩形框选 / 元素选择」双模式（Tab 切换）。 */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
    }
    #mask {
      position: fixed; inset: 0;
      background: rgba(15, 18, 20, 0.28);
    }
    /* 矩形拖拽选区框：主题色描边 + 内部“挖亮” */
    #sel {
      position: fixed;
      display: none;
      border: 1.5px solid rgba(112, 179, 168, 0.95);
      background: rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }
    /* 元素悬停高亮框：更醒目的实线 + 柔光 */
    #hl {
      position: fixed;
      display: none;
      border: 2px solid rgba(120, 190, 255, 0.95);
      background: rgba(120, 190, 255, 0.14);
      box-shadow: 0 0 0 1px rgba(10, 20, 30, 0.5), 0 0 14px rgba(120, 190, 255, 0.35);
      pointer-events: none;
      transition: left .04s linear, top .04s linear, width .04s linear, height .04s linear;
    }
    /* 尺寸/元素标签 */
    #tag {
      position: fixed;
      display: none;
      padding: 2px 8px;
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      color: #eaf3f1;
      background: rgba(15, 18, 20, 0.82);
      border: 1px solid rgba(112, 179, 168, 0.5);
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 顶部操作提示 */
    #hint {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px;
      font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
      color: #cfe0dc;
      background: rgba(15, 18, 20, 0.78);
      border: 1px solid rgba(112, 179, 168, 0.35);
      border-radius: 999px;
      pointer-events: none;
    }
    #hint b { color: #7dd8c6; font-weight: 600; }
    #hint .em { color: #78beff; }
  </style>
</head>
<body>
  <div id="mask"></div>
  <div id="hl"></div>
  <div id="sel"></div>
  <div id="tag"></div>
  <div id="hint"></div>
  <script src="overlay.js"></script>
</body>
</html>
